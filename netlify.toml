# Netlify detects Next.js and applies its Next.js runtime on its own.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Pre-launch page only (src/lib/launch.ts). Set to "false" and redeploy
  # on launch day to bring back pricing and checkout.
  NEXT_PUBLIC_PRELAUNCH = "true"
